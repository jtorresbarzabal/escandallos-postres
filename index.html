<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Escandallos y fichas técnicas de postres · Escuela de Hostelería San Roque">
<meta name="theme-color" content="#2457F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escandallos">
<meta name="application-name" content="Escandallos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Escandallos San Roque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra de marca fija arriba, pestañas como separadores de recetario; vistas en una columna ancha con paneles laterales que se apilan en móvil */
:root{
  --bg:#F3F6FF; --surface:#FFFFFF; --sunk:#E9EFFF; --ink:#0F1B3D; --muted:#56618A; --line:#D9E1F7;
  --gold:#2457F5; --gold-ink:#1A43C9; --gold-soft:#E4EBFF; --on-gold:#FFFFFF;
  --strong:#FFC23D; --on-strong:#0F1B3D;
  --ok:#14866D; --ok-soft:#DCF5EE; --warn:#A35F00; --warn-soft:#FFF1D6; --bad:#D6404E; --bad-soft:#FFE3E6;
  --f-display:"Fira Sans","Lucida Sans Unicode","Lucida Grande",system-ui,sans-serif;
  --f-body:"Fira Sans","Lucida Sans Unicode","Lucida Grande",system-ui,sans-serif;
  --r:14px; --brand-bg:linear-gradient(120deg,#1238D8 0%,#2457F5 55%,#3F8CFF 100%); --brand-fg:#FFFFFF; --brand-gold:#FFC23D;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1230; --surface:#121B42; --sunk:#18234F; --ink:#E8EEFF; --muted:#A5B2DD; --line:#26346B;
  --gold:#5C86FF; --gold-ink:#9DB7FF; --gold-soft:#1C2A63; --on-gold:#FFFFFF;
  --strong:#FFC23D; --on-strong:#0F1B3D;
  --ok:#4FD1AE; --ok-soft:#10342D; --warn:#FFC266; --warn-soft:#3A2B10; --bad:#FF7A86; --bad-soft:#3D1820;
  --brand-bg:linear-gradient(120deg,#0E2BA8 0%,#1C46D6 55%,#2F74F0 100%); --brand-fg:#FFFFFF; --brand-gold:#FFC23D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1230; --surface:#121B42; --sunk:#18234F; --ink:#E8EEFF; --muted:#A5B2DD; --line:#26346B;
  --gold:#5C86FF; --gold-ink:#9DB7FF; --gold-soft:#1C2A63; --on-gold:#FFFFFF;
  --strong:#FFC23D; --on-strong:#0F1B3D;
  --ok:#4FD1AE; --ok-soft:#10342D; --warn:#FFC266; --warn-soft:#3A2B10; --bad:#FF7A86; --bad-soft:#3D1820;
  --brand-bg:linear-gradient(120deg,#0E2BA8 0%,#1C46D6 55%,#2F74F0 100%); --brand-fg:#FFFFFF; --brand-gold:#FFC23D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Cabecera */
.brand{background:var(--brand-bg);color:var(--brand-fg);padding-inline:16px}
.brand-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand img{width:64px;height:64px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.brand-txt{min-width:0;flex:1}
.brand-txt .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.brand-txt h1{font-size:clamp(22px,3.2vw,32px);font-weight:800;color:#FFFFFF;letter-spacing:-.01em}
.brand .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;opacity:.92;margin-top:4px}
.brand .meta b{font-weight:700;color:var(--brand-gold)}
.btn-save{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--strong);color:var(--on-strong);border:0;border-radius:12px;padding:9px 20px;margin-block:6px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn-save:hover{filter:brightness(1.08)}
.btn-save .dot{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.35}
.btn-save.dirty{box-shadow:0 0 0 3px rgba(255,194,61,.45),0 2px 0 rgba(0,0,0,.25);animation:pulse 1.6s ease-in-out infinite}
.btn-save.dirty .dot{background:#F3A79E;opacity:1}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,194,61,.15),0 2px 0 rgba(0,0,0,.25)}}
@media (max-width:560px){.btn-save{padding:8px 12px;font-size:13px}}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,60,.5);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:22px;max-width:360px;width:100%;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-size:19px}
.pin-in{font-size:24px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.pin-err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.lock{max-width:380px;margin:30px auto;text-align:center}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-inline:16px}
.tabs-wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tabs-in{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;padding-top:8px;align-self:flex-end}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--gold-ink);border-color:var(--line);box-shadow:inset 0 3px 0 var(--gold)}
.tab .count{font-size:12px;background:var(--sunk);border-radius:20px;padding:1px 7px;margin-left:6px;color:var(--muted)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.view{display:grid;gap:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .grow{flex:1;min-width:180px}
.h-sec{font-size:22px;font-weight:700}
.sub{color:var(--muted);font-size:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.f > span small{font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:17px;margin-bottom:12px}
.tip{background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.tip b{color:var(--gold-ink)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--muted)}

/* Recetario */
.cats{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.group h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);font-family:var(--f-body);font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:10px;align-content:start}
.card:hover{border-color:var(--gold)}
.card .t{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.card .who{font-size:13px;color:var(--muted)}
.card .figs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.fig small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fig b{font-size:15px}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;max-width:100%}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* Ficha */
.ficha-head{display:grid;gap:10px}
.title-in{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);font-weight:700;border:none;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:4px 0}
.title-in:focus{box-shadow:none;border-color:var(--gold)}
.ficha-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.ficha-grid{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.results{position:sticky;top:64px;display:grid;gap:12px}
@media (max-width:900px){.results{position:static}}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .k{background:var(--sunk);border-radius:8px;padding:10px 12px}
.big .k small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big .k b{font-family:var(--f-display);font-size:24px;font-weight:700}
.rows{display:grid;gap:6px;font-size:14px}
.rows > div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:5px}
.rows > div span:first-child{color:var(--muted)}
.gauge{height:10px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ok)}
.gauge .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 8px;background:var(--sunk);font-weight:700;white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td input,td select{padding:6px 8px}
.lines td:first-child{min-width:210px}
.share{display:flex;align-items:center;gap:6px;min-width:90px}
.share .b{height:6px;border-radius:4px;background:var(--gold);min-width:2px}
.miss{color:var(--warn);font-weight:600;font-size:13px}
.linkbtn{background:none;border:none;color:var(--gold-ink);text-decoration:underline;cursor:pointer;padding:0;font-weight:600;font-size:13px}
.alg{display:flex;flex-wrap:wrap;gap:6px}
.alg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:14px;background:var(--surface)}
.alg input{accent-color:var(--gold)}
.alg label:has(input:checked){background:var(--gold-soft);border-color:var(--gold);font-weight:600}
.texts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo img{width:220px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* Ingredientes */
.ing-tbl td{white-space:nowrap}
.ing-tbl td:first-child,.ing-tbl th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.ing-tbl th:first-child{background:var(--sunk)}
.ing-tbl input[type=text]{min-width:170px}
.ing-tbl input[type=number]{width:92px}
.ing-tbl input[type=date]{width:140px}
.ing-tbl select{width:auto}
.cost-cell b{font-size:15px}
.unit{color:var(--muted);font-size:12px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.gallery figure button{position:absolute;top:6px;right:6px}
.gallery .add{border:2px dashed var(--line);border-radius:8px;aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;font-weight:600;padding:10px}
.gallery .add:hover{border-color:var(--gold);color:var(--ink)}
.iva-chip{font-size:11px;font-weight:700;color:var(--muted)}
/* Fotos */
.add-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:span 2}
.add .ico{display:block;font-size:26px;line-height:1;margin-bottom:6px}
.add.cam{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
@media (max-width:420px){.add-wrap{grid-column:1/-1}}

/* ---------- Móvil ---------- */
@media (max-width:640px){
  body{font-size:16px}
  .brand-in{gap:12px;padding-block:12px}
  .brand img{width:48px;height:48px}
  .brand-txt h1{font-size:22px}
  .brand .meta{font-size:12.5px;gap:2px 12px}
  .tab{padding:12px 14px;font-size:15px}
  main{padding-block:16px 80px}
  .view{gap:16px}
  .panel{padding:16px}
  .h-sec{font-size:21px}
  .btn{padding:11px 16px;font-size:15px}
  .btn.small{padding:8px 12px}
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px;padding:11px 12px;min-height:46px}
  .fields{grid-template-columns:1fr;gap:14px}
  .inline2{grid-template-columns:1fr 1fr}
  .texts{grid-template-columns:1fr}
  .bar .grow{min-width:0;flex-basis:100%}
  .bar input[type=search],.bar select{max-width:none!important;flex:1 1 100%}
  .cards{grid-template-columns:1fr}
  .notice{font-size:14px}
  .gallery{grid-template-columns:1fr 1fr}
  .add-wrap{grid-column:1/-1}
  .add{aspect-ratio:auto;padding:18px 10px}
  /* Tablas convertidas en tarjetas */
  .tbl-wrap{border:0;background:none;overflow:visible}
  .tbl-wrap table,.tbl-wrap tbody,.tbl-wrap tr,.tbl-wrap td{display:block;width:100%}
  .tbl-wrap thead{display:none}
  .tbl-wrap tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .tbl-wrap td{border:0;padding:0;white-space:normal!important;min-width:0!important;text-align:left!important}
  .tbl-wrap td[hidden]{display:none}
  .tbl-wrap td[data-label]::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tbl-wrap td.name{grid-column:1/-1;padding-right:44px}
  .tbl-wrap td.del{position:absolute;top:8px;right:6px;width:auto}
  .tbl-wrap td input,.tbl-wrap td select{width:100%!important;min-width:0!important;text-align:left!important}
  .tbl-wrap td span[style*="inline-flex"]{display:flex!important;width:100%}
  .ing-tbl td:first-child,.ing-tbl th:first-child{position:static;box-shadow:none;background:none}
  .lines td:first-child{min-width:0}
  .share{min-width:0}
  .mt-cat{display:none}
  .results{gap:12px}
  .big .k b{font-size:21px}
  .alg label{padding:8px 14px;font-size:15px}
  .modal{padding:20px}
}
.big-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:16px;text-decoration:none;white-space:normal;color:inherit}
.big-btn small{font-weight:500;font-size:12.5px;opacity:.85}
.btn.primary.big-btn{color:var(--on-gold)}
.save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--brand-bg);color:var(--brand-fg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.save-bar[hidden]{display:none}
.save-bar .sb-dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.save-bar .sb-txt{font-weight:700}
.save-bar .grow{flex:1}
.save-bar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5);background:transparent}
.save-bar .btn-save{margin:0}
@media (max-width:640px){.save-bar{padding:12px}.save-bar .grow{display:none}.save-bar .sb-txt{flex:1 1 100%}.save-bar .btn,.save-bar .btn-save{flex:1;justify-content:center}}
.ac{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(15,27,61,.18);max-height:min(340px,50vh);overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.ac-it{display:flex;flex-direction:column;gap:1px;padding:9px 11px;border-radius:8px;cursor:pointer}
.ac-it:hover,.ac-it.sel{background:var(--gold-soft)}
.ac-n{font-weight:600;color:var(--ink)}
.ac-n mark{background:none;color:var(--gold-ink);font-weight:800;text-decoration:underline;text-underline-offset:2px}
.ac-m{font-size:12.5px;color:var(--muted)}
.ac-empty{padding:12px;font-size:14px;color:var(--muted)}
@media (max-width:640px){.ac-it{padding:12px}.ac-n{font-size:16px}}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center;background:linear-gradient(135deg,var(--gold-soft),var(--surface));border:1px solid var(--line);border-radius:20px;padding:26px}
.hero h2{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--gold-ink);margin-bottom:8px}
.hero p{color:var(--muted);font-size:16px;margin:0;max-width:46ch}
.hero-form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.btn-new{background:var(--gold);color:#fff;border:0;border-radius:12px;padding:15px 18px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(36,87,245,.28)}
.btn-new:hover{filter:brightness(1.07)}
.hero-note{font-size:12.5px;color:var(--muted);text-align:center}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps3 .st{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.steps3 .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;font-weight:800;display:grid;place-items:center}
.steps3 b{display:block;margin-bottom:2px}
.steps3 p{margin:0;font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:18px}.steps3{grid-template-columns:1fr}}

const FDB='ehsr-escandallos-fotos-v2'; let fdb=null, fdbFail=false;
function fdbOpen(){ if(fdb||fdbFail) return Promise.resolve(fdb); return new Promise(res=>{ try{ const rq=indexedDB.open(FDB,1); rq.onupgradeneeded=()=>rq.result.createObjectStore('fotos'); rq.onsuccess=()=>{ fdb=rq.result; res(fdb); }; rq.onerror=()=>{ fdbFail=true; res(null); }; }catch(e){ fdbFail=true; res(null); } }); }
async function fotosGuardar(r){ const db=await fdbOpen(); if(!db) return false; return new Promise(res=>{ try{ const tx=db.transaction('fotos','readwrite'); const st=tx.objectStore('fotos'); if((r.fotos||[]).length) st.put(r.fotos.slice(),r.id); else st.delete(r.id); tx.oncomplete=()=>res(true); tx.onerror=()=>{ res(false); }; tx.onabort=()=>{ toast('No queda espacio para guardar más fotos en este dispositivo'); res(false); }; }catch(e){ res(false); } }); }
async function fotosBorrar(id){ const db=await fdbOpen(); if(!db) return; try{ db.transaction('fotos','readwrite').objectStore('fotos').delete(id); }catch(e){} }
async function fotosCargar(){ const db=await fdbOpen(); if(!db) return; const mias=S.recetas.filter(r=>!r.ejemplo&&r.tieneFotos);
  await Promise.all(mias.map(r=>new Promise(res=>{ try{ const rq=db.transaction('fotos','readonly').objectStore('fotos').get(r.id); rq.onsuccess=()=>{ if(Array.isArray(rq.result)) r.fotos=rq.result; res(); }; rq.onerror=()=>res(); }catch(e){ res(); } })));
  if(mias.length){ render(); if(ui.tab==='ficha') recalcFicha(); } }

const ingById = id=>S.ingredientes.find(i=>i.id===id);
const recById = id=>S.recetas.find(r=>r.id===id);
function unidadBase(medida){ return medida==='L'?'L':medida==='ud'?'ud':'kg'; }
function costeIng(ing){
  const base=num(ing.precio); if(base==null) return null;
  const ivaP=num(ing.iva); const precio = base*(1+(ivaP||0)/100);
  const unidades=num(ing.unidades)||1;
  let porUnidad=precio/unidades, bruto=porUnidad;
  if(ing.medida!=='ud'){
    const c=num(ing.contenido);
    if(c){ const base = (ing.contenidoUd==='g'||ing.contenidoUd==='ml')? c/1000 : c; bruto=porUnidad/base; }
  }
  const m=num(ing.merma)||0;
  const neto = m>0&&m<100 ? bruto/(1-m/100) : bruto;
  return {bruto,neto,base:unidadBase(ing.medida),conIva:precio,sinIva:ivaP==null};
}
function costeReceta(r, visit=new Set()){
  if(visit.has(r.id)) return {total:null,ciclo:true,falta:[],lines:[]};
  visit.add(r.id);
  let total=0, falta=[], lines=[];
  for(const l of r.lineas){
    const info=lineInfo(l,visit);
    lines.push(info);
    if(!info.src){ if(String(l.ref||'').trim()) falta.push(info.nombre||'?'); continue; }
    if(info.coste==null){ if(num(l.cant)!=null) falta.push(info.nombre); continue; }
    total+=info.coste;
  }
  visit.delete(r.id);
  const n=num(r.porciones);
  const valid = r.lineas.some(l=>l.ref);
  return {total: valid?total:null, racion: valid&&n?total/n:null, falta, lines};
}
function pesoReceta(r){ let g=0; for(const l of r.lineas){ const c=num(l.cant); if(c==null) continue; if(l.ud==='g'||l.ud==='ml') g+=c; else if(l.ud==='kg'||l.ud==='L') g+=c*1000; } return g; }
function lineInfo(l,visit=new Set()){
  const ref=l.ref||''; let src=null,nombre='',unit=null,medida='kg';
  if(ref.startsWith('i:')){ src=ingById(ref.slice(2)); if(src){nombre=src.nombre;medida=src.medida;const c=costeIng(src); unit=c?c.neto:null;} }
  else if(ref.startsWith('r:')){ src=recById(ref.slice(2)); if(src){nombre=src.nombre;medida='kg';const rend=pesoReceta(src); const cr=costeReceta(src,visit); unit=(rend&&cr.total!=null&&!cr.falta.length)?cr.total/(rend/1000):null;} }
  else if(ref.startsWith('?:')){ nombre=ref.slice(2); }
  const cant=num(l.cant); let qBase=null;
  if(cant!=null){ qBase = (l.ud==='g'||l.ud==='ml')? cant/1000 : cant; }
  const coste = unit!=null&&qBase!=null ? unit*qBase : null;
  return {src,nombre,unit,medida,base:unidadBase(medida),coste};
}
function unitsFor(medida){ return medida==='L'?['ml','L']:medida==='ud'?['ud']:['g','kg']; }
function resumen(r){
  const c=costeReceta(r); const iva=(num(r.iva)??num(S.settings.iva)??10)/100;
  const pvp=num(r.pvp); const neto=pvp!=null?pvp/(1+iva):null;
  const fc = c.racion!=null&&neto? c.racion/neto : null;
  const margen = c.racion!=null&&neto!=null? neto-c.racion : null;
  const n=num(r.porciones);
  const obj=(num(S.settings.objetivo)||30)/100;
  const sugNeto = c.racion!=null? c.racion/obj : null;
  return {...c,iva,pvp,neto,fc,margen,margenTotal: margen!=null&&n?margen*n:null, sugNeto, sugPvp: sugNeto!=null?sugNeto*(1+iva):null, obj};
}
function fcClass(fc,obj){ if(fc==null) return 'neutral'; if(fc<=obj) return 'ok'; if(fc<=obj+0.08) return 'warn'; return 'bad'; }
function usos(ingId){ return S.recetas.filter(r=>r.lineas.some(l=>l.ref==='i:'+ingId)).length; }

function recalcFicha(){
  const box=$('#ficha'); if(!box) return; const r=recById(box.dataset.id); const s=resumen(r);
  const factor = num(ui.escala)&&num(r.porciones)? num(ui.escala)/num(r.porciones) : null;
  $$('#lines tr').forEach(tr=>{
    const i=+tr.dataset.i, l=r.lineas[i], info=s.lines[i]||lineInfo(l);
    tr.querySelector('[data-o=unit]').innerHTML = info.unit!=null? eur(info.unit)+' <span class="unit">/'+info.base+'</span>' : (info.src?'<span class="miss">Sin precio</span>':'');
    tr.querySelector('[data-o=coste]').textContent = info.coste!=null? eur(info.coste,3):'—';
    const sh = info.coste!=null&&s.total? info.coste/s.total : null;
    tr.querySelector('[data-o=share]').innerHTML = sh!=null? `<div class="share"><span class="b" style="width:${Math.max(2,sh*70)}px"></span><span class="num">${pct(sh)}</span></div>`:'';
    const e=tr.querySelector('[data-o=esc]'); e.hidden=!num(ui.escala);
    e.textContent = factor&&num(l.cant)!=null? fmt(num(l.cant)*factor,1)+' '+(l.ud||''):'';
  });
  $('#th-esc').hidden=!num(ui.escala);
  const inc=s.falta.length>0;
  $('#res-alert').innerHTML = !r.lineas.length? '<span class="pill neutral">Añade ingredientes para calcular</span>'
    : inc? `<div class="notice" style="font-weight:500">Faltan precios de: <b>${s.falta.map(esc).join(', ')}</b>. Los totales no son definitivos. <button class="linkbtn" data-act="ir-ing">Ir a Ingredientes y precios</button></div>`
    : (num(r.escala)?'':'' ) + (num(r.porciones)?'<span class="pill ok">Escandallo completo</span>':'<span class="pill warn">Indica el nº de porciones</span>');
  $('#o-total').textContent = s.total!=null? eur(s.total):'—';
  $('#o-racion').textContent = s.racion!=null? eur(s.racion):'—';
  $('#o-neto').textContent = eur(s.neto);
  const fcOK = !inc && s.fc!=null;
  $('#o-fc').innerHTML = fcOK? `<span class="pill ${fcClass(s.fc,s.obj)}">${pct(s.fc)}</span>`:'—';
  $('#o-margen').textContent = !inc? eur(s.margen):'—';
  $('#o-margent').textContent = !inc? eur(s.margenTotal):'—';
  const g=$('#o-gauge'); const w=fcOK? Math.min(100,s.fc*100/0.6*1):0;
  g.style.width = (fcOK? Math.min(100,s.fc/0.6*100):0)+'%';
  g.style.background = fcOK? `var(--${fcClass(s.fc,s.obj)})`:'var(--sunk)';
  $('#o-mark').style.left = Math.min(100,s.obj/0.6*100)+'%';
  $('#o-gtxt').textContent = `Escala 0–60 %. La marca indica el objetivo del ${fmt(s.obj*100,0)} % (se cambia en Ajustes).`;
  $('#o-sug').innerHTML = (!inc && s.racion!=null && S.settings.verPvp!==false)
    ? `<b>Precio orientativo</b> para un ${fmt(s.obj*100,0)} % de coste: <b class="num">${eur(s.sugPvp)}</b> con IVA (${eur(s.sugNeto)} sin IVA). Es una referencia de cálculo; el precio final lo decide el equipo.`
    : `<b>Cómo se calcula:</b> coste de cada ingrediente = cantidad × coste unitario con IVA (€/kg, €/L o €/ud). Coste por ración = coste total ÷ nº de porciones. % de coste = coste por ración ÷ precio neto.`;
}

function acOpciones(q,currentId,modo){

const ALB_STOP=new Set('de del la las el los en con sin para al por kgs kg grs gr lts ml uds und unid unidad unidades bol bolsa caja saco bote pqt paquete lata cubo brick pack pza'.split(' '));

function lev1(a,b){ if(Math.abs(a.length-b.length)>1) return false; let i=0,j=0,d=0; while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;continue;} if(++d>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++;} } return d+(a.length-i)+(b.length-j)<=1; }

function albNums(line){ const out=[]; const re=/\d[\d.,]*/g; let m;
  while((m=re.exec(line))){ const s=m[0].replace(/[.,]+$/,''); const after=line.slice(m.index+m[0].length).replace(/^\s+/,''); if(after[0]==='%') continue;
    if(!/[.,]\d{1,4}$/.test(s)) continue; let v;
    if(s.includes(',')) v=parseFloat(s.replace(/\./g,'').replace(',','.')); else { if(/\.\d{3}$/.test(s)) continue; v=parseFloat(s); }
    if(isFinite(v)&&v>0&&v<100000) out.push(+v.toFixed(4)); }

  return trio? cand[1] : nums[0];

function albCabecera(texto){
  const t=norm(texto); const tt=new Set(albToks(texto)); let prov='';

function albAnalizar(texto,provDetectado){

  filas.forEach((f,k)=>{ for(const {i,t} of ingT){ if(!t.length) continue; let sc=0;
      if((i.aliasAlb||[]).includes(f.clave)) sc=2;
      else { let tot=0,ok=0,fuertes=0,n=0; for(const x of t){ const w=1/df[x]; tot+=w; if(f.toks.some(y=>tokEq(x,y))){ ok+=w; n++; if(df[x]<=2&&x.length>=4) fuertes++; } } sc=ok/tot; if(sc<0.45||n<Math.min(2,t.length)||(!fuertes&&sc<0.99)) sc=0; }

}

  if(alb.estado==='leyendo'){ res.innerHTML=''; }
  else res.innerHTML=`
    <div class="am-g"><h4>Productos a actualizar <span class="pill neutral">${auto.length}</span></h4>
      ${auto.length?auto.map(([it,k])=>albItem(it,k)).join(''):'<div class="sub" style="margin-bottom:8px">No se ha reconocido ningún ingrediente del listado. Puedes asignarlos tú desde las líneas de abajo o añadirlos a mano.</div>'}
      <button class="btn" data-aa="manual">+ Añadir a mano otro producto de este albarán</button></div>
    ${resto.length?`<details class="am-g" ${auto.length?'':'open'}><summary style="cursor:pointer;font-weight:700;margin-bottom:8px">Líneas con precio no reconocidas (${resto.length}) · asígnalas a un ingrediente o créalo</summary>${resto.map(([it,k])=>albItem(it,k)).join('')}</details>`:''}
    <div class="tip"><b>Importante:</b> el precio que se aplica es el <b>precio sin IVA por unidad de compra</b> (por kg, por saco, por caja…), igual que en la tabla. Si el albarán da el precio por caja y el ingrediente está por kg, corrígelo antes de aplicar.</div>`;
  albContar();
}
function albContar(){ const bg=alb&&alb.el; if(!bg) return; const n=alb.items.filter(it=>it.on&&it.ing&&num(it.precio)!=null).length; const b=bg.querySelector('#alb-aplicar'); b.disabled=!n; b.textContent= n? `Aplicar ${n} ${n===1?'cambio':'cambios'}` : 'Aplicar cambios'; }
function albEstado(html,cls,p){ const e=alb&&alb.el&&alb.el.querySelector('#alb-estado'); if(!e) return; e.className='alb-estado'+(cls?' '+cls:''); e.hidden=!html; e.innerHTML='<div>'+html+'</div>'+(p!=null?`<div class="prog"><i style="width:${Math.round(p*100)}%"></i></div>`:''); }
async function abrirAlbaran(file){
  let foto, ocrCanvas;
  try{ const url=URL.createObjectURL(file); ocrCanvas=await imgCanvas(url,2400,true); foto=(await imgCanvas(url,1400,false)).toDataURL('image/jpeg',0.7); URL.revokeObjectURL(url); }
  catch(e){ toast('No se ha podido abrir la imagen'); return; }
  const bg=document.createElement('div'); bg.className='modal-bg sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Revisar albarán">
    <div class="sh-h"><h3>📄 Revisar albarán</h3><button class="btn small" data-aa="cerrar" aria-label="Cerrar">✕</button></div>
    <div class="sh-b">
      <div class="alb-top"><div class="alb-foto" data-aa="zoom" title="Ver en grande"><img src="${foto}" alt="Foto del albarán"><small>🔍 Toca para ampliar</small></div>
        <div class="alb-meta"><label class="f full">Proveedor<input type="text" id="alb-prov" list="dl-prov" placeholder="Proveedor del albarán"></label>
          <label class="f">Nº de albarán<input type="text" id="alb-num"></label><label class="f">Fecha del albarán<input type="date" id="alb-fecha" value="${today()}"></label>
          <div class="sub full" style="font-size:13px">Estos datos se copian en los ingredientes que actualices.</div></div></div>
      <div class="alb-estado" id="alb-estado"></div>
      <div id="alb-res"></div>
    </div>
    <div class="sh-f"><button class="btn ghost" data-aa="cerrar">Cancelar</button><span class="grow"></span><button class="btn primary" id="alb-aplicar" data-aa="aplicar" disabled>Aplicar cambios</button></div></div>`;
  document.body.appendChild(bg); document.body.style.overflow='hidden';
  alb={el:bg,foto,items:[],estado:'leyendo'};
  const me=alb;
  bg.addEventListener('click',e=>{ const b=e.target.closest('[data-aa]'); if(!b) return; const k=b.closest('.am')?+b.closest('.am').dataset.k:null; const it=k!=null?alb.items[k]:null;
    switch(b.dataset.aa){
      case 'cerrar': albCerrar(); break;
      case 'zoom': verFoto(alb.foto); break;
      case 'num': it.precio=+b.dataset.v; it.on=!!it.ing; albRepintarItem(k); break;
      case 'manual': alb.items.push({linea:'',clave:'',nums:[],ing:'',auto:false,manual:true,on:true,precio:'',nombreNuevo:''}); albPintar(); const sel=bg.querySelector(`.am[data-k="${alb.items.length-1}"] select`); sel&&sel.focus(); break;
      case 'quitar': alb.items.splice(k,1); albPintar(); break;
      case 'aplicar': albAplicar(); break;
    } });
  bg.addEventListener('change',e=>{ const t=e.target, am=t.closest('.am'); if(!am) return; const k=+am.dataset.k, it=alb.items[k];
    if(t.dataset.am==='on'){ it.on=t.checked; am.classList.toggle('off',!it.on); albContar(); }
    if(t.dataset.am==='ing'){ it.ing=t.value; it.on=!!t.value; const ing=ingById(t.value); if(ing&&it.nums.length) it.precio=albPrecio(it.nums,num(ing.precio)); albRepintarItem(k); } });
  bg.addEventListener('input',e=>{ const t=e.target, am=t.closest('.am'); if(!am) return; const it=alb.items[+am.dataset.k];
    if(t.dataset.am==='precio'){ it.precio=t.value; am.querySelectorAll('.am-nums button').forEach(b=>b.classList.toggle('on',+b.dataset.v===num(t.value))); const tmp=document.createElement('div'); tmp.innerHTML=albItem(it,+am.dataset.k); am.querySelector('.am-dif').innerHTML=tmp.querySelector('.am-dif').innerHTML; albContar(); }
    if(t.dataset.am==='nombreNuevo') it.nombreNuevo=t.value; });
  albEstado('Preparando el lector de albaranes… <span class="sub">(la primera vez tarda un poco más porque se descarga)</span>','',0.02);
  let texto='';
  try{
    const T=await cargarTess();
    const w=await T.createWorker('spa',1,{logger:m=>{ if(alb!==me) return; if(m.status==='recognizing text') albEstado('Leyendo el albarán… '+Math.round(m.progress*100)+' %','',0.3+m.progress*0.7); else if(/load|initializ/.test(m.status||'')) albEstado('Preparando el lector de albaranes… <span class="sub">(la primera vez tarda un poco más porque se descarga)</span>','',0.05+(m.progress||0)*0.25); }});
    const r=await w.recognize(ocrCanvas); texto=(r&&r.data&&r.data.text)||''; w.terminate();
  }catch(e){ if(alb!==me) return; alb.estado='error'; albEstado('No se ha podido leer el albarán automáticamente (hace falta conexión a internet la primera vez). Puedes ver la foto ampliada y añadir los precios a mano.','err'); alb.items=[]; albPintar(); return; }
  if(alb!==me) return;
  const cab=albCabecera(texto); if(cab.prov) bg.querySelector('#alb-prov').value=cab.prov; if(cab.num) bg.querySelector('#alb-num').value=cab.num; if(cab.fecha) bg.querySelector('#alb-fecha').value=cab.fecha;
  alb.items=albAnalizar(texto,cab.prov); alb.estado='listo';
  const nOk=alb.items.filter(i=>i.auto).length;
  albEstado(nOk?`✅ <b>${nOk} ${nOk===1?'producto reconocido':'productos reconocidos'}.</b> Comprueba cada precio con la foto, desmarca lo que no quieras cambiar y pulsa «Aplicar».`:(alb.items.length?'No se ha reconocido ningún ingrediente automáticamente. Revisa las líneas leídas y asígnalas tú.':'No se ha encontrado texto con precios. Prueba con una foto más cercana, recta y con buena luz, o añade los precios a mano.'), nOk?'':'err');
  albPintar();
}
function albRepintarItem(k){ const am=alb.el.querySelector(`.am[data-k="${k}"]`); if(!am) return; const tmp=document.createElement('div'); tmp.innerHTML=albItem(alb.items[k],k); am.replaceWith(tmp.firstElementChild); albContar(); }
function albCerrar(){ if(!alb) return; alb.el.remove(); alb=null; document.body.style.overflow=''; }
function verFoto(src,id){ const v=document.createElement('div'); v.className='alb-viewer'; v.innerHTML=`<div class="bar">${id?'<button class="btn small" data-v="borrar">🗑 Borrar del historial</button><span class="grow"></span>':''}<button class="btn small" data-v="zoom">🔍 Ampliar</button><button class="btn small" data-v="cerrar">✕ Cerrar</button></div><div class="vw"><img src="${src}" alt="Albarán"></div>`;
  document.body.appendChild(v); v.addEventListener('click',async e=>{ const b=e.target.closest('[data-v]'); if(!b) return; if(b.dataset.v==='cerrar') v.remove(); if(b.dataset.v==='zoom'){ v.classList.toggle('z'); b.textContent=v.classList.contains('z')?'🔍 Reducir':'🔍 Ampliar'; } if(b.dataset.v==='borrar'){ await albBorrarHist(id); v.remove(); render(); toast('Albarán borrado del historial'); } }); }
async function albAplicar(){
  const prov=alb.el.querySelector('#alb-prov').value.trim(), numA=alb.el.querySelector('#alb-num').value.trim(), fecha=alb.el.querySelector('#alb-fecha').value;
  const sel=alb.items.filter(it=>it.on&&it.ing&&num(it.precio)!=null);
  if(sel.some(it=>it.ing==='__new'&&!String(it.nombreNuevo||'').trim())){ toast('Escribe el nombre del ingrediente nuevo'); return; }
  const ids=[]; let nuevos=0;
  for(const it of sel){
    let ing;
    if(it.ing==='__new'){ ing={id:uid(),nombre:it.nombreNuevo.trim(),familia:'Otros',medida:'kg',formato:'',proveedor:'',albaran:'',fecha:'',precio:'',iva:'',unidades:'',contenido:'',contenidoUd:'kg',merma:''}; S.ingredientes.push(ing); nuevos++; }
    else ing=ingById(it.ing);
    if(!ing||ids.includes(ing.id)) continue;
    ing.precio=+num(it.precio).toFixed(4); if(prov) ing.proveedor=prov; if(numA) ing.albaran=numA; if(fecha) ing.fecha=fecha;
    if(it.clave) ing.aliasAlb=[...new Set([...(ing.aliasAlb||[]),it.clave])].slice(-6);
    ids.push(ing.id); marcarIng();
  }
  const foto=alb.foto; albCerrar();
  await albGuardarHist({id:uid(),ts:Date.now(),foto,proveedor:prov,albaran:numA,fecha,n:ids.length});
  ui.iq=''; ui.ifam='Todas'; ui.iprov=''; render();
  ids.forEach(id=>{ const tr=document.querySelector(`tr[data-ing="${id}"]`); if(tr) tr.classList.add('upd'); });
  const first=ids.length&&document.querySelector(`tr[data-ing="${ids[0]}"]`); if(first) first.scrollIntoView({block:'center',behavior:'smooth'});
  toast(ids.length? `${ids.length} ${ids.length===1?'ingrediente actualizado':'ingredientes actualizados'} (en verde)${nuevos?'. Completa IVA y formato de los nuevos':''}. Pulsa GUARDAR CAMBIOS.` : 'No se ha aplicado ningún cambio');
}
function readPhoto(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const max=1000; const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); }; img.onerror=rej; img.src=url; }); }
function importar(data,mode){
  if(!data||!Array.isArray(data.ingredientes)) throw new Error('formato');
  const map={}; let nuevos=0, act=0;
  for(const src of data.ingredientes){
    let dst=S.ingredientes.find(x=>norm(x.nombre)===norm(src.nombre));
    if(dst){ if(mode==='imp-precios'||num(dst.precio)==null){ ['precio','iva','proveedor','albaran','unidades','contenido','contenidoUd','merma','fecha','formato','medida','familia'].forEach(k=>{ if(src[k]!==undefined&&src[k]!=='') dst[k]=src[k]; }); act++; } }
    else { dst={...src,id:uid()}; S.ingredientes.push(dst); nuevos++; }
    map[src.id]=dst.id;
  }
  let recs=0;
  if(mode==='imp-todo'&&Array.isArray(data.recetas)){
    const rmap={}; const nuevas=data.recetas.map(r=>{ const c=JSON.parse(JSON.stringify(r)); rmap[r.id]=c.id=uid(); return c; });
    nuevas.forEach(c=>{ c.fotos=Array.isArray(c.fotos)?c.fotos.filter(f=>String(f).startsWith('data:')):(c.foto?[c.foto]:[]); delete c.foto; c.lineas=(c.lineas||[]).map(l=>{ const ref=l.ref||''; if(ref.startsWith('i:')) return {...l,ref:map[ref.slice(2)]?'i:'+map[ref.slice(2)]:ref}; if(ref.startsWith('r:')) return {...l,ref:rmap[ref.slice(2)]?'r:'+rmap[ref.slice(2)]:ref}; return l; }); c.alergenos=c.alergenos||[]; S.recetas.push(c); recs++; });
    if(data.settings&&Array.isArray(data.settings.categorias)) data.settings.categorias.forEach(c=>{ if(!S.settings.categorias.includes(c)) S.settings.categorias.push(c); });
  }
  save(); render(); toast(mode==='imp-precios'? `${act} ingredientes actualizados, ${nuevos} nuevos` : `${recs} recetas añadidas, ${nuevos} ingredientes nuevos`);
}

try{ cargarCfg(); cargarRecetas(); }catch(e){ console.error(e); }
fotosCargar();
nubeLeer();
albCargarHist().then(()=>{ if(ui.tab==='ingredientes'&&desbloqueado&&albHist.length) render(); });
setTab(ui.tab);
})();
</script>
